[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cave-portable"
version = "0.4.6"
description = "A lightweight, cross-platform weather visualization companion to AWIPS CAVE"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{name = "CAVE Portable contributors"}]
dependencies = ["Pillow>=10,<13", "eccodes>=2.43,<3"]
[project.optional-dependencies]
research = ["pyshp>=2.3,<3", "shapely>=2,<3"]
keywords = ["weather", "radar", "satellite", "metar", "awips"]

[project.scripts]
cave-portable = "cave_portable:main"

[project.urls]
Homepage = "https://github.com/rhamenator/cave-portable"
Issues = "https://github.com/rhamenator/cave-portable/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cave_portable = ["assets/icon-32.png", "assets/icon-64.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

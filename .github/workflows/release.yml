name: Build desktop bundles
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  bundle:
    strategy:
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cave-portable-linux-x86_64
            icon: ''
            gtk: '--hidden-import=cave_portable.gtk_app'
          - os: windows-latest
            artifact: cave-portable-windows-x86_64
            icon: '--icon=src/cave_portable/assets/cave-portable.ico'
            gtk: ''
          - os: macos-15-intel
            artifact: cave-portable-macos-x86_64
            icon: '--icon=src/cave_portable/assets/cave-portable.icns'
            gtk: ''
          - os: macos-latest
            artifact: cave-portable-macos-arm64
            icon: '--icon=src/cave_portable/assets/cave-portable.icns'
            gtk: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - name: Prepare Linux GTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0
          echo 'PYTHONPATH=/usr/lib/python3/dist-packages' >> "$GITHUB_ENV"
      - name: Verify Linux GTK import
        if: runner.os == 'Linux'
        run: python -c 'import gi; gi.require_version("Gtk", "3.0"); from gi.repository import Gtk; print(Gtk.get_major_version())'
      - run: python -m pip install '.[research]' pyinstaller
      - name: Match CFFI to Linux GTK runtime
        if: runner.os == 'Linux'
        run: python -m pip install 'cffi==1.16.0'
      - name: Verify MRMS decoder dependency
        run: python -c 'import eccodes; print(eccodes.codes_get_api_version())'
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name CAVE-Portable --collect-data cave_portable ${{ matrix.gtk }} ${{ matrix.icon }} launcher.py
      - name: Package bundle
        run: python scripts/package_bundle.py "${{ matrix.artifact }}"
      - name: Verify per-user Linux install
        if: runner.os == 'Linux'
        run: |
          sh dist/install-linux.sh
          test -x "$HOME/.local/bin/cave-portable"
          test -f "$HOME/.local/share/applications/cave-portable.desktop"
      - name: Verify per-user Windows install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./dist/install-windows.ps1
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\CAVE Portable\CAVE-Portable.exe'))) { throw 'Installed executable missing' }
          if (-not (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\CAVE Portable.lnk'))) { throw 'Start Menu shortcut missing' }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --generate-notes
          fi

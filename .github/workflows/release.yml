name: Build desktop bundles
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  bundle:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cave-portable-linux-x86_64
          - os: windows-latest
            artifact: cave-portable-windows-x86_64
          - os: macos-15-intel
            artifact: cave-portable-macos-x86_64
          - os: macos-latest
            artifact: cave-portable-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name CAVE-Portable launcher.py
      - name: Package bundle
        run: python scripts/package_bundle.py "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --generate-notes

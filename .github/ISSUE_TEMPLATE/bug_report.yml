name: Bug report
description: Report a reproducible problem
body:
  - type: input
    id: version
    attributes:
      label: Version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Expected and actual results
    validations:
      required: true
